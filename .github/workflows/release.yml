name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: version in package.json matches the tag
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm pack
      - name: the tarball installs and runs in a clean folder
        run: |
          mkdir /tmp/clean && cd /tmp/clean && npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/checkmeter-*.tgz
          npx checkmeter --version
          npx checkmeter --demo --no-color | grep -q "READINGS THAT DON'T ADD UP"
      - name: attach the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file .github/release-notes.md
          gh release upload "$GITHUB_REF_NAME" checkmeter-*.tgz --clobber
