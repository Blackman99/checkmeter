name: pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'src/core/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: bundle the analyser the landing page runs in the browser
        run: npm ci --ignore-scripts && npm run build:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: d
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: landing, docs, share images and the analyser bundle answer 200
        run: |
          for u in "" docs/ blog/ blog/reading-the-meter/ blog/zh/reading-the-meter/ og.png og-docs.png img/favicon.svg img/logo-512.png js/analyse.js app.js; do
            for i in 1 2 3 4 5 6; do
              c=$(curl -s -o /dev/null -w '%{http_code}' "https://blackman99.github.io/checkmeter/$u")
              [ "$c" = 200 ] && break; sleep 10
            done
            echo "$u -> $c"; [ "$c" = 200 ]
          done
      - name: share tags point at real images
        run: |
          curl -s https://blackman99.github.io/checkmeter/ | grep -q 'og:image" content="https://blackman99.github.io/checkmeter/og.png"'
          curl -s https://blackman99.github.io/checkmeter/docs/ | grep -q 'twitter:image" content="https://blackman99.github.io/checkmeter/og-docs.png"'
